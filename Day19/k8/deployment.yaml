apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-ml-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: iris-ml-app

  template:
    metadata:
      labels:
        app: iris-ml-app

    spec:
      containers:
        - name: iris-ml-container
          image: shivamrana28/iris-m1-app:v26
          imagePullPolicy: IfNotPresent

          # Intentional crash for CrashLoopBackOff demonstration
          command:
            - python
            - -c
            - |
              import time
              print("Starting intentional crash demo", flush=True)
              time.sleep(5)
              raise RuntimeError("Intentional crash for Video 19 demo")

          ports:
            - containerPort: 8000

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: iris-ml-config
                  key: APP_ENV

            - name: ML_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iris-ml-secret
                  key: ML_API_KEY